<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">From webcam to WebXR hands</title>
  <desc id="desc">A webcam feeds MediaPipe landmarks, which are mapped to articulated joints and exposed as WebXR hand input in an IWSDK app.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#10131b"/>
      <stop offset="1" stop-color="#211730"/>
    </linearGradient>
    <linearGradient id="line" x2="1">
      <stop stop-color="#8edcff"/>
      <stop offset="1" stop-color="#e7a8e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="56" y="66" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="600">How it works</text>
  <text x="56" y="98" fill="#abb1c2" font-family="Arial, sans-serif" font-size="16">The camera stays on your computer. Your app receives ordinary WebXR hand input.</text>
  <path d="M262 204h38m218 0h38m218 0h38" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <path d="m291 196 10 8-10 8m256-16 10 8-10 8m256-16 10 8-10 8" fill="none" stroke="#c8d5ea" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <rect x="50" y="145" width="212" height="120" rx="16" fill="#202938" stroke="#5c7188"/>
    <text x="74" y="190" fill="#8edcff" font-size="18" font-weight="600">01  Webcam</text>
    <text x="74" y="223" fill="#d2d8e2" font-size="15">Local video frames</text>
    <rect x="300" y="145" width="218" height="120" rx="16" fill="#202938" stroke="#5c7188"/>
    <text x="324" y="190" fill="#8edcff" font-size="18" font-weight="600">02  MediaPipe</text>
    <text x="324" y="223" fill="#d2d8e2" font-size="15">21 landmarks per hand</text>
    <rect x="556" y="145" width="218" height="120" rx="16" fill="#202938" stroke="#5c7188"/>
    <text x="580" y="190" fill="#e7a8e9" font-size="18" font-weight="600">03  IWER</text>
    <text x="580" y="223" fill="#d2d8e2" font-size="15">Articulated XR joints</text>
    <rect x="812" y="145" width="338" height="120" rx="16" fill="#29223b" stroke="#a278bd"/>
    <text x="836" y="190" fill="#e7a8e9" font-size="18" font-weight="600">04  Your WebXR app</text>
    <text x="836" y="223" fill="#d2d8e2" font-size="15">XRInputSource.hand · pinch · poke</text>
  </g>
  <text x="56" y="320" fill="#8991a2" font-family="Arial, sans-serif" font-size="14">Development input for desktop VR · depth is estimated from one camera</text>
</svg>
